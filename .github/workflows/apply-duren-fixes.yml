name: Apply Duren fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch game
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('durniak.html')
          data = path.read_bytes()
          nl = b'\r\n' if b'\r\n' in data[:8000] else b'\n'

          def n(text: str) -> bytes:
              return text.encode('utf-8').replace(b'\n', nl)

          old = n("""    state.boutDefenderStart = Math.min(attackLimit(), state.table.length + state.hands[newDefender].length);
    state.maxAttacks = Math.min(attackLimit(), Math.max(state.table.length, state.boutDefenderStart));""")
          new = n("""    // After a transfer the attack limit is based on the NEW defender's hand
    // at the moment they become defender. Cards already on the table are part
    // of that same limit; they must not be added to the hand size.
    state.boutDefenderStart = state.hands[newDefender].length;
    state.maxAttacks = Math.min(attackLimit(), state.boutDefenderStart);""")

          if old not in data:
              raise SystemExit('Expected transfer-limit code was not found')
          data = data.replace(old, new, 1)

          css_marker = b'/* ---------- Phone landscape: compact one-screen table ---------- */'
          if css_marker not in data:
              css = n(r"""

/* ---------- Phone landscape: compact one-screen table ---------- */
@media (orientation: landscape) and (max-height: 520px) and (max-width: 1000px) {
  html, body { height: 100%; min-height: 100%; overflow: hidden; }
  body { height: 100vh; }
  .app-shell { height: 100vh; min-height: 0; overflow: hidden; }

  .topbar {
    min-height: 48px; height: 48px; padding: 4px 8px; gap: 8px;
    grid-template-columns: 92px minmax(0,1fr) auto;
  }
  .brand-block .eyebrow { display: none; }
  h1 { margin: 0; font-size: 19px; letter-spacing: .08em; }
  .top-stats { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 4px; }
  .top-stat { min-height: 38px; padding: 4px 7px; border-radius: 8px; }
  .top-stat > span { font-size: 8px; letter-spacing: .05em; }
  .top-stat > b { gap: 4px; margin-top: 2px; font-size: 11px; }
  .top-stat > small { margin-top: 1px; font-size: 8px; }
  .top-stat-primary b { font-size: 13px; }
  .trump-icon { width: 24px; height: 24px; border-radius: 7px; font-size: 15px; }
  .top-actions { gap: 4px; flex-wrap: nowrap; justify-content: flex-end; }
  .phase-chip { max-width: 92px; overflow: hidden; text-overflow: ellipsis; padding: 5px 7px; font-size: 8px; }
  .speed-control { gap: 0; }
  .speed-control span { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .speed-control select { min-width: 74px; padding: 5px 7px; font-size: 10px; border-radius: 8px; }
  .ghost-button { min-height: 34px; padding: 6px 8px; font-size: 10px; border-radius: 8px; }

  .game-layout {
    grid-template-columns: 148px minmax(0,1fr);
    flex: 1 1 auto; min-height: 0; height: calc(100vh - 48px);
  }
  .helper-panel {
    order: 1; position: relative; height: 100%; min-height: 0; overflow: hidden;
    border-right: 1px solid rgba(255,255,255,.09); border-top: 0;
  }
  .helper-head { padding: 5px 7px 4px; gap: 4px; }
  .helper-head .eyebrow { display: none; }
  .helper-head strong { margin: 0; font-size: 14px; }
  .rule-badges { margin-top: 0; gap: 2px; justify-content: flex-end; }
  .rule-badge { padding: 2px 4px; font-size: 7px; }
  .helper-tabs { gap: 3px; padding: 4px; }
  .helper-tab { min-height: 29px; padding: 5px 2px; border-radius: 6px; font-size: 9px; }
  .helper-pane { max-height: none; padding: 5px; overflow-y: auto; }
  .score-list { gap: 4px; }
  .player-panel { grid-template-columns: 25px minmax(0,1fr) auto; gap: 5px; padding: 4px; border-radius: 8px; }
  .avatar { width: 25px; height: 25px; font-size: 8px; }
  .player-name { font-size: 10px; }
  .player-role { margin-top: 1px; font-size: 8px; }
  .player-count { padding: 3px 5px; font-size: 9px; }
  .seat-badge { margin-left: 2px; padding: 2px 4px; font-size: 7px; }
  .helper-explainer { margin-top: 5px; padding: 6px; border-radius: 8px; }
  .helper-explainer b { margin-top: 2px; font-size: 10px; }
  .helper-explainer p { margin-top: 3px; font-size: 9px; line-height: 1.25; }
  .calc-label { font-size: 8px; }
  .log > div { padding: 5px 2px; font-size: 9px; line-height: 1.25; }
  .rules-summary h4 { margin: 8px 0 3px; font-size: 11px; }
  .rules-summary p { font-size: 9px; line-height: 1.3; }
  .tutorial-coach { margin: 4px; padding: 6px; border-radius: 8px; }
  .tutorial-coach p, .coach-rule { font-size: 9px; line-height: 1.25; }

  .table-wrap {
    order: 2; height: 100%; min-height: 0; gap: 3px; overflow: hidden;
    display: grid; grid-template-rows: minmax(0,1fr) auto 84px;
  }
  .felt-table { border-width: 7px 9px 10px; }
  .felt-table::after { inset: 14px 15px 16px; }
  .table-stage { min-height: 0; padding: 3px 5px; }
  .center-brand { font-size: 28px; letter-spacing: .12em; }

  .bot-seat { width: 116px; gap: 2px; }
  .bot-seat.slot-left { left: 3px; top: 2px; }
  .bot-seat.slot-right { right: 3px; top: 2px; }
  .bot-seat.slot-top { top: 2px; }
  .nameplate { grid-template-columns: 24px minmax(0,1fr); gap: 4px; padding: 3px 5px; border-radius: 7px; }
  .nameplate .avatar { width: 24px; height: 24px; font-size: 8px; }
  .nameplate .player-name { font-size: 9px; }
  .nameplate .player-role { font-size: 7px; }
  .nameplate .player-count { display: none; }
  .bot-hand { height: 34px; }
  .bot-hand .card-back { width: 25px; height: 36px; margin-right: -14px; border-width: 1px; border-radius: 4px; }
  .seat-bubble { bottom: -8px; padding: 2px 5px; font-size: 7px; }

  .talon-zone, .discard-zone { bottom: 2px; }
  .talon-zone { left: 4px; width: 70px; }
  .discard-zone { right: 4px; width: 60px; }
  .zone-label { margin-bottom: 2px; font-size: 7px; }
  .talon-stack, .discard-stack { height: 45px; }
  .card-back { width: 31px; height: 44px; border-width: 1px; border-radius: 4px; }
  .card-back span { font-size: 6px; }
  .talon-stack .talon-back { left: 18px; }
  .trump-card .card { width: 31px; height: 44px; border-radius: 4px; }
  .trump-card .card .corner b { font-size: 8px; }
  .trump-card .card .corner i { font-size: 7px; }
  .trump-card .card .pip { font-size: 17px; }
  .talon-count { margin-top: 2px; padding: 2px 5px; font-size: 8px; }
  .talon-empty { width: 31px; height: 44px; font-size: 6px; }

  .table-cards { width: min(330px,62%); top: 57%; gap: 3px 5px; }
  .table-pair, .table-pair .card { width: 40px; height: 56px; }
  .table-pair .card { border-radius: 5px; }
  .table-pair .card.defense-card { transform: translate(9px,10px) rotate(7deg); }
  .table-pair .card .corner b { font-size: 9px; }
  .table-pair .card .corner i { font-size: 8px; }
  .table-pair .card .pip { font-size: 20px; }
  .table-empty { font-size: 9px; }

  .action-bar {
    flex: none; width: calc(100% - 10px); min-height: 0; height: auto;
    padding: 5px 7px; border-radius: 9px;
  }
  .action-content { display: grid; grid-template-columns: minmax(130px,1fr) auto; align-items: center; column-gap: 6px; }
  .status-text { min-height: 0; margin: 0; font-size: 11px; line-height: 1.2; }
  .beginner-tip { grid-column: 1/-1; margin: 3px 0 0; padding: 3px 6px; max-height: 28px; overflow-y: auto; font-size: 9px; line-height: 1.2; }
  .controls { justify-content: flex-end; gap: 4px; flex-wrap: nowrap; }
  .action { min-height: 34px; padding: 6px 9px; border-radius: 8px; font-size: 10px; white-space: nowrap; }

  .human-hand-slot { flex: none; height: 84px; margin: 0 6px 4px; min-height: 0; }
  .human-hand { min-height: 0; height: 84px; padding: 6px 4px 6px; align-items: flex-end; }
  .card { width: 50px; height: 70px; margin-left: -13px; border-radius: 6px; }
  .corner.top { top: 4px; left: 5px; }
  .corner.bottom { bottom: 4px; right: 5px; }
  .corner b { font-size: 11px; }
  .corner i { font-size: 10px; }
  .pip { font-size: 25px; }
  .human-hand .card.playable:hover { transform: translateY(calc(var(--fan-y,0px) - 6px)) rotate(var(--fan-angle,0deg)); }
  .card.selected { transform: translateY(calc(var(--fan-y,0px) - 8px)) rotate(var(--fan-angle,0deg)) !important; }

  .settings-modal, .result-modal { padding: 6px; }
  .settings-card { max-height: calc(100vh - 12px); padding: 10px; }
  .settings-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
  .settings-grid section { padding: 8px; }
  .toggle-row, .select-row { padding: 6px 0; }
  .toggle-row input { width: 20px; height: 20px; }
  .toggle-row b, .select-row b { font-size: 11px; }
  .toggle-row small, .select-row small { font-size: 9px; }
}
""")
              marker = nl + b'  </style>'
              if marker not in data:
                  raise SystemExit('Style closing marker was not found')
              data = data.replace(marker, css + marker, 1)

          path.write_bytes(data)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- durniak.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durniak.html
          git commit -m "Fix transfer limit and phone landscape layout"
          git push

name: Apply Duren fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-duren-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch game
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          path = Path('durniak.html')
          data = path.read_bytes()
          nl = b'\r\n' if b'\r\n' in data[:8000] else b'\n'

          old = nl.join([
              b'    state.boutDefenderStart = Math.min(attackLimit(), state.table.length + state.hands[newDefender].length);',
              b'    state.maxAttacks = Math.min(attackLimit(), Math.max(state.table.length, state.boutDefenderStart));',
          ])
          new = nl.join([
              b"    // After a transfer the attack limit is based on the NEW defender's hand",
              b'    // at the moment they become defender. Cards already on the table are part',
              b'    // of that same limit; they must not be added to the hand size.',
              b'    state.boutDefenderStart = state.hands[newDefender].length;',
              b'    state.maxAttacks = Math.min(attackLimit(), state.boutDefenderStart);',
          ])
          if old not in data:
              raise SystemExit('Expected transfer-limit code was not found')
          data = data.replace(old, new, 1)

          payload = ''
          css = gzip.decompress(base64.b64decode(payload)).replace(b'\n', nl)
          marker = nl + b'  </style>'
          if marker not in data:
              raise SystemExit('Style closing marker was not found')
          data = data.replace(marker, nl + nl + css + marker, 1)

          path.write_bytes(data)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durniak.html
          git commit -m "Fix transfer limit and phone landscape layout"
          git push

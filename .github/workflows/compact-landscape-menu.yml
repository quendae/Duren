name: Compact landscape menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-landscape-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch menu layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('durniak.html')
          data=p.read_bytes()
          nl=b'\r\n' if b'\r\n' in data[:8000] else b'\n'
          marker=b'@media (orientation: landscape) and (max-height: 520px) and (max-width: 1000px) {'+nl
          if b'  .main-menu { place-items: start center;' not in data:
              lines=[
                  b'  .main-menu { place-items: start center; padding: 6px; overflow-y: auto; }',
                  b'  .main-menu::before { inset: 5px; border-width: 6px; }',
                  b'  .menu-card { width: min(680px, calc(100vw - 18px)); padding: 9px 14px 8px; border-radius: 14px; }',
                  b'  .menu-card > .eyebrow { display: none; }',
                  b'  .menu-mark { width: 34px; height: 34px; margin: 0 auto 2px; font-size: 18px; }',
                  b'  .menu-card h2 { font-size: 25px; letter-spacing: .1em; }',
                  b'  .menu-subtitle { margin: 3px 0 7px; font-size: 9px; }',
                  b'  .menu-actions { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 5px; }',
                  b'  .menu-button { min-height: 40px; padding: 5px 7px; grid-template-columns: 20px minmax(0,1fr) 14px; border-radius: 9px; font-size: 11px; }',
                  b'  .menu-button .menu-icon { font-size: 15px; }',
                  b'  .menu-language { grid-template-columns: 1fr 145px; gap: 8px; margin-top: 6px; padding-top: 6px; }',
                  b'  .menu-language span { font-size: 8px; }',
                  b'  .menu-language select { padding: 5px 7px; font-size: 10px; }',
                  b'  .menu-session-info { min-height: 10px; margin-top: 2px; font-size: 8px; }',
              ]
              if marker not in data: raise SystemExit('Landscape marker not found')
              data=data.replace(marker,marker+nl.join(lines)+nl,1)
              p.write_bytes(data)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- durniak.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durniak.html
          git commit -m "Compact main menu on phone landscape"
          git push

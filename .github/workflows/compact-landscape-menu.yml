name: Compact landscape menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-landscape-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch menu layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          p=Path('durniak.html')
          data=p.read_bytes()
          nl=b'\r\n' if b'\r\n' in data[:8000] else b'\n'
          marker=b'@media (orientation: landscape) and (max-height: 520px) and (max-width: 1000px) {'+nl
          if b'  .main-menu { place-items: start center;' not in data:
              payload=''
              css=gzip.decompress(base64.b64decode(payload)).replace(b'\n',nl)
              data=data.replace(marker,marker+css,1)
              p.write_bytes(data)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- durniak.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durniak.html
          git commit -m "Compact main menu on phone landscape"
          git push

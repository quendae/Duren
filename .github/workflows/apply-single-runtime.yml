name: Apply single-runtime migration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-single-runtime.mjs
      - .github/workflows/apply-single-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize legacy line endings
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'durniak-offline.html','index.html','multiplayer.js','multiplayer.css',
              'mp/core.js','mp/game.js','mp/network-server.js',
              'tests/multiplayer_smoke.mjs','tests/shared_server_smoke.mjs'
          ]:
              p=Path(name)
              p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          PY
      - name: Generate single runtime
        run: node scripts/apply-single-runtime.mjs
      - name: Finish same-page bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('multiplayer.js')
          text=p.read_text()
          text=text.replace('mp.frameWindow.Durak', 'window.Durak')
          text=text.replace('mp.frameWindow?.Durak', 'window.Durak')
          p.write_text(text)
          PY
          ! grep -R -E 'frameWindow|contentWindow|contentDocument' multiplayer.js mp/core.js mp/game.js mp/network-server.js
      - name: Syntax checks
        run: |
          node --check game.js
          node --check multiplayer.js
          node --check mp/core.js
          node --check mp/game.js
          node --check mp/network-server.js
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Single runtime smoke
        run: node tests/single_runtime_smoke.mjs
      - name: Resume smoke
        run: node tests/resume_smoke.mjs
      - name: Multiplayer regression
        run: node tests/multiplayer_smoke.mjs
      - name: Shared QQND smoke
        run: node tests/shared_server_smoke.mjs
      - name: Commit verified runtime only
        run: |
          rm -rf node_modules
          git config user.name "qqnd-ci"
          git config user.email "actions@users.noreply.github.com"
          git reset
          git add index.html game.css game.js multiplayer.css multiplayer.js
          git add mp/core.js mp/game.js mp/network-server.js
          git add tests/single_runtime_smoke.mjs tests/resume_smoke.mjs tests/multiplayer_smoke.mjs tests/shared_server_smoke.mjs
          git add DEPLOY_MULTIPLAYER.md
          git add -u durniak-offline.html
          git diff --cached --quiet && exit 0
          git commit -m "refactor: unify Duren offline and multiplayer runtime [skip ci]"
          git push origin HEAD:main

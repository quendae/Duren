name: Finalize single-runtime migration

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-single-runtime.mjs
      - .github/workflows/apply-single-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final hardening
        run: node scripts/finalize-single-runtime.mjs
      - name: Syntax and structural checks
        run: |
          node --check game.js
          node --check multiplayer.js
          node --check mp/core.js
          node --check mp/game.js
          node --check mp/network-server.js
          ! grep -R -E 'durniak-offline\.html|<iframe|contentWindow|contentDocument|frameWindow|RTCPeerConnection|cloudflare-signaling' index.html game.js multiplayer.js mp/core.js mp/game.js mp/network-server.js
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run full regression suite
        run: |
          node tests/single_runtime_smoke.mjs
          node tests/resume_smoke.mjs
          node tests/multiplayer_smoke.mjs
          node tests/shared_server_smoke.mjs
      - name: Commit verified hardening
        run: |
          rm -rf node_modules
          git config user.name "qqnd-ci"
          git config user.email "actions@users.noreply.github.com"
          git reset
          git add index.html game.js mp/game.js mp/network-server.js tests/shared_server_smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden Duren shared menu lifecycle [skip ci]"
          git push origin HEAD:main

name: Apply single-runtime migration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-single-runtime.mjs
      - .github/workflows/apply-single-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate single runtime
        run: node scripts/apply-single-runtime.mjs
      - name: Syntax checks
        run: |
          node --check game.js
          node --check multiplayer.js
          node --check mp/core.js
          node --check mp/game.js
          node --check mp/network-server.js
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Single runtime smoke
        run: node tests/single_runtime_smoke.mjs
      - name: Resume smoke
        run: node tests/resume_smoke.mjs
      - name: Multiplayer regression
        run: node tests/multiplayer_smoke.mjs
      - name: Shared QQND smoke
        run: node tests/shared_server_smoke.mjs
      - name: Commit generated runtime
        run: |
          git config user.name "qqnd-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: unify Duren offline and multiplayer runtime [skip ci]"
          git push origin HEAD:main

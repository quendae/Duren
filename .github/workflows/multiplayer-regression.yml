name: Multiplayer regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Runtime structure and syntax
        run: |
          test -f index.html
          test -f game.css
          test -f game.js
          test -f dev-layout.css
          test -f dev-layout.js
          test -f multiplayer.css
          test -f multiplayer.js
          test -f mp/core.js
          test -f mp/game.js
          test -f mp/network-server.js
          test ! -e durniak-offline.html
          test ! -e cloudflare-signaling
          test ! -e mp/network.js
          test ! -e mp/shared-finalize.js
          node --check game.js
          node --check dev-layout.js
          node --check multiplayer.js
          node --check mp/core.js
          node --check mp/game.js
          node --check mp/network-server.js
          ! grep -R -E 'durniak-offline\.html|<iframe|contentWindow|contentDocument|frameWindow|RTCPeerConnection|cloudflare-signaling' index.html game.js dev-layout.js multiplayer.js mp/core.js mp/game.js mp/network-server.js
          grep -q 'dev-layout.css?v=20260909-dev1' index.html
          grep -q 'dev-layout.js?v=20260909-dev1' index.html
          grep -q 'wss://api.qqnd.fyi/api/v1/ws' mp/network-server.js
          grep -q "type: 'game.state.commit'" mp/network-server.js
          grep -q "type: 'game.state.publish'" mp/network-server.js
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Single runtime and shared menu smoke
        run: node tests/single_runtime_smoke.mjs
      - name: Resume priority smoke
        run: node tests/resume_smoke.mjs
      - name: Multiplayer gameplay and responsive regression
        run: node tests/multiplayer_smoke.mjs
      - name: Shared QQND server browser smoke
        run: node tests/shared_server_smoke.mjs
      - name: Desktop motion and tutorial UX smoke
        run: node tests/ux_motion_tutorial_smoke.mjs
      - name: Desktop DEV layout smoke
        run: node tests/dev_layout_smoke.mjs
